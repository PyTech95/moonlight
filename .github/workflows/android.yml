name: Android app

# Builds the signed Moonlight Neurocare Android app (APK for direct install, AAB for Google Play)
# and attaches both to a GitHub Release.
# Run it from the Actions tab ("Run workflow"), or push a tag such as app-v1.0.1.
on:
  workflow_dispatch:
    inputs:
      app_url:
        description: Page the app opens (must be https)
        required: false
        default: https://moonlightneurocare.com/login
  push:
    tags:
      - 'app-v*'

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_URL: ${{ inputs.app_url || 'https://moonlightneurocare.com/login' }}
      APP_VERSION_CODE: ${{ github.run_number }}
      APP_VERSION_NAME: 1.0.${{ github.run_number }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install
        run: npm ci

      - name: Configure and sync the Android project
        run: npm run sync

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "ANDROID_KEYSTORE_BASE64 secret is missing"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APK and AAB
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Check the signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/release/app-release.apk | head -5
          mkdir -p "$RUNNER_TEMP/out"
          cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/out/moonlight-neurocare-$APP_VERSION_NAME.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/out/moonlight-neurocare-$APP_VERSION_NAME.aab"
          ls -la "$RUNNER_TEMP/out"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then TAG="${GITHUB_REF_NAME}"; else TAG="app-build-${GITHUB_RUN_NUMBER}"; fi
          gh release create "$TAG" "$RUNNER_TEMP"/out/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Moonlight Neurocare app $APP_VERSION_NAME" \
            --notes "Android app $APP_VERSION_NAME (version code $APP_VERSION_CODE). Opens $APP_URL. APK: install directly on a phone. AAB: upload to Google Play."
